<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحة التاجر | محرك مصران</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand js-site-brand" href="index.html"><i class="fas fa-ankh me-2"></i>محرك مصران</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="projects.html">المشاريع</a></li>
          <li class="nav-item"><a class="nav-link nav-engine-download" href="engine.html"><i class="fas fa-download me-1"></i>تحميل المحرك</a></li>
          <li class="nav-item"><a class="nav-link" href="content.html"><i class="fas fa-play-circle me-1"></i>المحتوى</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#about">عن المتجر</a></li>
          <li class="nav-item"><a class="nav-link" href="support.html"><i class="fas fa-headset me-1"></i>الدعم <span class="nav-support-badge support-badge-dot d-none"></span></a></li>
        </ul>
        <div class="d-flex align-items-center gap-3" id="authArea"></div>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div id="sellerHeader" class="mb-4">
      <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
    </div>

    <h4 class="mb-3"><i class="fas fa-box-open me-2"></i>منتجات التاجر</h4>
    <div class="row g-4" id="sellerProducts">
      <div class="col-12 text-center py-4"><div class="spinner-border text-primary"></div></div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <div class="spinner-overlay d-none" id="loadingOverlay">
    <div class="spinner-border text-primary" style="width:3rem;height:3rem;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { auth, db, onAuthStateChanged, collection, getDocs, query, where, limit, doc, getDoc } from './firebase.js';
    import { showToast, showLoading, getInitials } from './app.js';

    const params = new URLSearchParams(location.search);
    const sellerId = params.get('id');

    if (!sellerId) {
      document.getElementById('sellerHeader').innerHTML = '<div class="alert alert-warning">لم يتم تحديد التاجر</div>';
      document.getElementById('sellerProducts').innerHTML = '';
    } else {
      loadSeller();
    }

    async function loadSeller() {
      try {
        let sellerName = 'تاجر';
        let sellerBio = '';
        let sellerPhoto = '';
        if (sellerId === 'official') {
          sellerName = 'محرك مصران';
          sellerBio = 'الحساب الرسمي لمحرك مصران';
          try {
            const cached = sessionStorage.getItem('officialProfilePhoto');
            if (cached) sellerPhoto = cached;
            else {
              const oSnap = await getDoc(doc(db, 'settings', 'officialProfile'));
              if (oSnap.exists()) {
                sellerPhoto = oSnap.data().photoURL || oSnap.data().avatarUrl || '';
                if (sellerPhoto) try { sessionStorage.setItem('officialProfilePhoto', sellerPhoto); } catch (_) {}
              }
            }
          } catch (_) {}
        } else {
          const uSnap = await getDoc(doc(db, 'users', sellerId));
          if (uSnap.exists()) {
            const u = uSnap.data();
            sellerName = u.name || 'تاجر';
            sellerBio = u.bio || '';
            sellerPhoto = u.photoURL || u.avatarUrl || '';
          }
        }

        const initials = (sellerName || '?').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        const avatarBlock = sellerPhoto
          ? `<div class="user-avatar" style="width:64px;height:64px;padding:0;overflow:hidden;background:transparent;"><img src="${sellerPhoto}" alt="" style="width:100%;height:100%;object-fit:cover;"></div>`
          : `<div class="user-avatar" style="width:64px;height:64px;font-size:1.4rem;">${initials}</div>`;
        document.getElementById('sellerHeader').innerHTML = `
          <div class="card shadow-sm border-0">
            <div class="card-body d-flex align-items-center gap-3 flex-wrap">
              ${avatarBlock}
              <div>
                <h3 class="mb-1 d-flex align-items-center gap-2 flex-wrap">${sellerName}${sellerId==='official' ? ' <span class="badge bg-primary"><i class="fas fa-check-circle me-1"></i>موثّق</span>' : ''}</h3>
                ${sellerBio ? `<p class="text-muted mb-0 small">${sellerBio}</p>` : ''}
                <p class="text-muted mb-0 small"><i class="fas fa-store me-1"></i>صفحة التاجر</p>
              </div>
            </div>
          </div>`;

        let snap;
        const sk = 'sellerProds:' + sellerId;
        const sc = window.localCache?.get(sk);
        if (Array.isArray(sc) && sc.length) {
          snap = { docs: sc.map(x => ({ id: x.id, data: () => x.data })) };
        } else {
          snap = await getDocs(query(collection(db, 'projects'), where('sellerId', '==', sellerId), limit(60)));
          try { window.localCache?.set(sk, snap.docs.map(d => ({ id: d.id, data: d.data() }))); } catch(_){}
        }
        const prods = snap.docs.filter(d => {
          const p = d.data();
          return !p.status || p.status === 'active';
        }).sort((a, b) => (b.data().createdAt?.toMillis?.() || 0) - (a.data().createdAt?.toMillis?.() || 0));

        const grid = document.getElementById('sellerProducts');
        if (prods.length === 0) {
          grid.innerHTML = '<div class="col-12"><div class="alert alert-info">لا توجد منتجات منشورة لهذا التاجر حالياً</div></div>';
          return;
        }

        grid.innerHTML = prods.map(d => {
          const p = d.data();
          const priceHtml = p.isFree || p.price === 0
            ? '<span class="project-price free">مجاني</span>'
            : `<span class="project-price">${p.price} ج.م</span>`;
          const verified = p.isOfficial
            ? '<span class="badge-verified ms-1"><i class="fas fa-check-circle"></i> المحرك</span>'
            : '';
          return `
            <div class="col-md-4 col-sm-6">
              <a href="product.html?id=${d.id}" class="text-decoration-none">
                <div class="project-card h-100">
                  <img src="${p.thumbnailDirect || p.thumbnail || 'https://via.placeholder.com/400x180?text=Project'}" class="project-thumb" alt="${p.title}" onerror="this.src='https://via.placeholder.com/400x180?text=Project'">
                  <div class="project-body">
                    <div class="project-title">${p.title} ${verified}</div>
                    <div class="text-muted small mb-2 text-truncate">${p.description || ''}</div>
                    <div class="d-flex justify-content-between align-items-center">
                      ${priceHtml}
                      <small class="text-muted">${p.sales || 0} مبيعات</small>
                    </div>
                  </div>
                </div>
              </a>
            </div>`;
        }).join('');
      } catch (err) {
        console.error(err);
        document.getElementById('sellerHeader').innerHTML = `<div class="alert alert-danger">خطأ: ${err.message}</div>`;
        document.getElementById('sellerProducts').innerHTML = '';
      }
    }

    // Auth area (basic)
    onAuthStateChanged(auth, async (user) => {
      const area = document.getElementById('authArea');
      if (!area) return;
      if (user) {
        const snap = await getDoc(doc(db, 'users', user.uid));
        const name = snap.exists() ? (snap.data().name || user.displayName) : user.displayName;
        area.innerHTML = `
          <a href="projects.html" class="btn btn-outline-primary btn-sm">كل المشاريع</a>
          <a href="account.html" class="btn btn-outline-secondary btn-sm">${name || 'حسابي'}</a>
          <a href="index.html" class="btn btn-outline-secondary btn-sm">الرئيسية</a>`;
      }
    });
  </script>
</body>
</html>
