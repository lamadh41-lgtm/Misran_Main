<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحميل المحرك | محرك مصران</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand js-site-brand" href="index.html"><i class="fas fa-ankh me-2"></i>محرك مصران</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="projects.html">المشاريع</a></li>
          <li class="nav-item"><a class="nav-link active nav-engine-download" href="engine.html"><i class="fas fa-download me-1"></i>تحميل المحرك</a></li>
          <li class="nav-item"><a class="nav-link" href="content.html"><i class="fas fa-play-circle me-1"></i>المحتوى</a></li>
          <li class="nav-item"><a class="nav-link" href="support.html"><i class="fas fa-headset me-1"></i>الدعم</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3" id="authArea"></div>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div id="enginePageBody" class="account-card p-4" style="border:1px solid rgba(201,162,39,0.3);border-radius:16px;background:var(--card,#fffcf7);">
      <div class="text-center text-muted py-5">جاري التحميل...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import './app.js';
    import { softFetch, cacheGet } from './localCache.js';
    import { db, doc, getDoc } from './firebase.js';

    async function load() {
      const body = document.getElementById('enginePageBody');
      let data = {};
      try {
        const { data: d } = await softFetch('settings:engine', async () => {
          const snap = await getDoc(doc(db, 'settings', 'engine'));
          return snap.exists() ? snap.data() : {};
        }, { sessionFlag: 'soft:settings:engine', maxAgeMs: 5 * 60 * 1000 });
        data = d || {};
      } catch {
        data = cacheGet('settings:engine') || {};
      }
      if (typeof applySiteBranding === 'function') applySiteBranding(data);
      else if (window.applySiteBranding) window.applySiteBranding(data);

      const name = data.engineName || data.name || 'محرك مصران';
      const ver = data.version || '—';
      const desc = data.description || 'لا يوجد وصف بعد.';
      const imgs = data.images || [];
      let dl = data.downloadUrl || '';
      if (dl && typeof getDriveDownloadUrl === 'function') dl = getDriveDownloadUrl(dl);
      else if (data.fileId) dl = `https://drive.google.com/uc?export=download&id=${data.fileId}`;

      const imgsHtml = imgs.length
        ? `<div class="d-flex flex-wrap gap-2 mb-3 justify-content-center">${imgs.map(im => {
            const u = typeof im === 'string' ? im : (im.url || '');
            return u ? `<img src="${u}" alt="" style="max-width:200px;max-height:140px;object-fit:cover;border-radius:12px;border:1px solid rgba(201,162,39,0.3);">` : '';
          }).join('')}</div>`
        : '';

      body.innerHTML = `
        ${imgsHtml}
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
          <div>
            <h2 class="fw-bold mb-1">${name}</h2>
            <span class="badge bg-warning text-dark fs-6">أحدث إصدار: ${ver}</span>
          </div>
          ${dl
            ? `<a class="btn btn-primary-custom text-dark fw-bold btn-lg" href="${dl}" download>
                 <i class="fas fa-download me-1"></i>تحميل <small>(أحدث إصدار)</small>
               </a>`
            : `<button type="button" class="btn btn-secondary btn-lg" disabled>التحميل غير متاح بعد</button>`}
        </div>
        <p class="mb-3" style="white-space:pre-wrap;line-height:1.8;">${desc}</p>
        <div class="alert alert-info mb-0">
          <i class="fas fa-shield-alt me-1"></i>
          متخافش: لما تحمّل المحرك وتفتح نافذة المشاريع هتلاقي مشاريعك زي ما هي موجودة.
        </div>`;
    }
    load();
  </script>
</body>
</html>
